services:
  postgres:
    image: postgres:15
    container_name: twx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: twx_password_123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - twx-network
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-init:
    image: devopscadit/postgresql-init-twx:platform9.7.5
    container_name: twx-db-init
    entrypoint: ["/usr/local/bin/db-setup.sh"]
    environment:
      DATABASE_ADMIN_USERNAME: postgres
      DATABASE_ADMIN_PASSWORD: twx_password_123
      DATABASE_ADMIN_SCHEMA: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      TWX_DATABASE_USERNAME: twadmin_9_7_5
      TWX_DATABASE_SCHEMA: twadmin_9_7_5
      TWX_DATABASE_PASSWORD: twx_password_123
      TABLESPACE_LOCATION: /var/lib/postgresql/data
    networks:
      - twx-network
    depends_on:
      postgres:
        condition: service_healthy

  thingworx:
    image: devopscadit/platform-postgres:platform9.7.5
    container_name: twx-platform
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      TWX_DATABASE_USERNAME: twadmin_9_7_5
      TWX_DATABASE_SCHEMA: twadmin_9_7_5
      TWX_DATABASE_PASSWORD: twx_password_123
      THINGWORX_INITIAL_ADMIN_PASSWORD: TwxAdm1nP@ssw0rd!
      THINGWORX_INITIAL_METRICS_USER_PASSWORD: MetricsP@ssw0rd!
      ENABLE_CONSOLE_OUTPUT: "true"
      CATALINA_OPTS: -Xms1g -Xmx2g
      THINGWORX_PLATFORM_SCRIPTTIMEOUT: "30"
      TOMCAT_KEEPALIVETIMEOUT: "20000"
      TOMCAT_CONNECTIONTIMEOUT: "20000"
      TOMCAT_MAXCONNECTION: "10000"
      TOMCAT_MAXTHREADS: "200"
      TOMCAT_CATALINA_LEVEL: FINE
      TOMCAT_LOCALHOST_LEVEL: FINE
      TOMCAT_MANAGER_LEVEL: FINE
      TOMCAT_HOSTMANAGER_LEVEL: FINE
      EXTPKG_IMPORT_POLICY_ENABLED: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_ENTITIES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_EXTENTITIES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_JARRES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_JSRES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_CSSRES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_JSONRES: "true"
      EXTPKG_IMPORT_POLICY_ALLOW_WEBAPPRES: "true"
    env_file:
      - .env
    networks:
      - twx-network
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  gitea:
    image: gitea/gitea:1.22.3
    container_name: twx-gitea
    ports:
      - "3000:3000"
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: localhost
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: "http://localhost:3000/"
      GITEA__database__DB_TYPE: sqlite3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - twx-network
    volumes:
      - gitea-data:/data

networks:
  twx-network:
    driver: bridge

volumes:
  pgdata:
  gitea-data:
